<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Kept in step with src/components/brand/aristo-mark.tsx by hand. Static
       hex only: a favicon renders outside the page, so CSS custom properties
       and oklch() are not available to it. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25384a"/><stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="swipe" x1="4" y1="0" x2="28" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2bb4f"/><stop offset="1" stop-color="#dd9331"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#tile)"/>
  <g transform="rotate(-5 16 19)">
    <rect x="4.5" y="16.2" width="23" height="5.8" rx="1.2" fill="url(#swipe)"/>
  </g>
  <path d="M8.6 26 16 7l7.4 19" fill="none" stroke="#f6f3ea" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
